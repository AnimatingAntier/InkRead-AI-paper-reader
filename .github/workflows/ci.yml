name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Inkreader-GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Inkreader-GitHub/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Inkreader-GitHub/package-lock.json
      - name: Check repository for secrets
        run: python scripts/check_secrets.py .
      - name: Install frontend dependencies
        run: npm ci
      - name: Check and build frontend
        run: |
          npm run check
          npm run build
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
