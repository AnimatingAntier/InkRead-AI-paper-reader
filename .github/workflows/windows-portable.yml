name: Windows portable

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-portable.yml"

permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=v1.1.0
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists"
          else
            gh release create "$TAG" \
              --title "InkRead ${TAG}" \
              --target "${GITHUB_SHA}" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file .github/RELEASE_NOTES_v1.1.0.md
          fi

  build:
    needs: ensure-release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Inkreader-GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Inkreader-GitHub/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Generate icon
        run: python scripts/make_icon.py
      - name: Build portable app
        run: python -m PyInstaller --noconfirm --distpath release --workpath build InkRead.spec
      - name: Zip and upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.ensure-release.outputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          if (-not $tag) { $tag = "v1.1.0" }
          $ver = $tag.TrimStart("v")
          $name = "InkRead-$ver-windows-x64.zip"
          if (-not (Test-Path "release/InkRead/InkRead.exe")) {
            throw "InkRead.exe was not produced"
          }
          Compress-Archive -Path "release/InkRead" -DestinationPath $name -Force
          gh release upload $tag $name --repo $env:GITHUB_REPOSITORY --clobber
